name: VoiceInk
options:
  bundleIdPrefix: com.voiceink
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 2UANJX7ATM
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.9"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.0"

targets:
  VoiceInk:
    type: application
    platform: macOS
    sources:
      - path: VoiceInk
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceink.app
        INFOPLIST_FILE: VoiceInk/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceInk/Resources/VoiceInk.entitlements
        PRODUCT_NAME: VoiceInk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.3"
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: Sparkle
        product: Sparkle

  VoiceInkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VoiceInkTests
    dependencies:
      - target: VoiceInk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceink.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VoiceInk:
    build:
      targets:
        VoiceInk: all
    test:
      targets:
        - VoiceInkTests
    run: {}
